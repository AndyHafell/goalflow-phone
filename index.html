<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app run under the notch and the home
         indicator; the safe-area padding in phone.css puts the content back. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>GoalFlow</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS reads none of the manifest's icons. Added to the home screen it
         looks for exactly this, and falls back to a screenshot of the page
         without it — which is how a web app ends up with no logo. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GoalFlow" />
    <!-- black-translucent, so the status bar sits on the app's own ground
         rather than on a grey strip above it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#18181b" />
    <script type="module" crossorigin src="./assets/index-CM3CZSbJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C0DnM8L-.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Registered from the page rather than the bundle so it is picked up on
      // the very first paint, before React has parsed. Failure is silent on
      // purpose: no service worker means no offline launch, not a broken app,
      // and it is absent by design when the phone is served off the Mac over
      // plain http (iOS only registers one over https).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // updateViaCache:'none' because the browser will otherwise serve
          // sw.js itself out of the HTTP cache for up to a day -- which means
          // a deploy is invisible to the one file whose whole job is noticing
          // deploys. This shipped a stale bundle once already.
          navigator.serviceWorker
            .register('./sw.js', { updateViaCache: 'none' })
            .then(reg => reg.update())
            .catch(() => {});

          // A new worker taking over means the assets under us just changed.
          // Reload once, guarded, because controllerchange also fires on the
          // very first install and a reload loop is worse than a stale tab.
          let reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloading) return;
            reloading = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
